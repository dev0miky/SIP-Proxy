[global]
type=global
endpoint_identifier_order=ip,username,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=91.214.78.248
external_signaling_address=91.214.78.248

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=91.214.78.248
external_signaling_address=91.214.78.248

[kamailio]
type=endpoint
context=default
disallow=all
allow=opus
allow=ulaw
allow=alaw
trust_id_inbound=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no

[kamailio]
type=identify
endpoint=kamailio
match=172.18.0.0/16

[kamailio]
type=aor
max_contacts=1
