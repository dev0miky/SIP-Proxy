name: sip-proxy

networks:
  sip:
    driver: bridge

services:
  mysql:
    image: mariadb:11
    container_name: sipproxy-mysql
    environment:
      MARIADB_ROOT_PASSWORD: kamailio
      MARIADB_DATABASE: kamailio
      MARIADB_USER: kamailio
      MARIADB_PASSWORD: kamailio
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    networks: [sip]
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-pkamailio"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:15
    container_name: sipproxy-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./homer/postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    networks: [sip]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  heplify-server:
    image: sipcapture/heplify-server:latest
    container_name: sipproxy-heplify
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./homer/heplify/heplify-server.toml:/etc/heplify-server.toml:ro
    command: ["./heplify-server", "--config", "/etc/heplify-server.toml"]
    networks: [sip]
    ports:
      - "9060:9060/udp"

  homer-webapp:
    image: sipcapture/webapp:latest
    container_name: sipproxy-homer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: homer
      DB_PASS: homer
      DB_CONF_NAME: homer_config
      DB_DATA_NAME: homer_data
    ports:
      - "9080:80"
    networks: [sip]

  freeswitch:
    build: ./freeswitch
    platform: linux/amd64
    container_name: sipproxy-freeswitch
    networks: [sip]
    ports:
      - "16384-16484:16384-16484/udp"
    depends_on:
      - heplify-server
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  kamailio:
    build: ./kamailio
    container_name: sipproxy-kamailio
    networks: [sip]
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    depends_on:
      mysql:
        condition: service_healthy
      freeswitch:
        condition: service_started
      heplify-server:
        condition: service_started
    environment:
      DB_URL: "mysql://kamailio:kamailio@mysql/kamailio"
      FS_ADDR: "freeswitch:5080"
      HEP_ADDR: "heplify-server:9060"

volumes:
  mysql-data:
  postgres-data:
