name: sip-proxy

networks:
  sip:
    driver: bridge

services:
  mysql:
    image: mysql:8
    container_name: sipproxy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: kamailio
      MYSQL_DATABASE: kamailio
      MYSQL_USER: kamailio
      MYSQL_PASSWORD: kamailio
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    networks: [sip]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pkamailio"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
