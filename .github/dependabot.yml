version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/panel/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/panel/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/kamailio"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/asterisk"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/panel/api"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/panel/web"
    schedule:
      interval: "monthly"
