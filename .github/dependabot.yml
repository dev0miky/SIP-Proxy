version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/panel/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/panel/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "tailwind-merge"
          - "autoprefixer"
          - "postcss"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/kamailio"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/asterisk"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/panel/api"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/panel/web"
    schedule:
      interval: "monthly"
