#!KAMAILIO

debug=2
log_stderror=yes
fork=no
children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "sanity.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "app_lua.so"

modparam("app_lua", "load", "/etc/kamailio/lua/kamailio.lua")
cfgengine "lua"
