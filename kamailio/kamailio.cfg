#!KAMAILIO

debug=2
log_stderror=yes
fork=no
children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "sanity.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "app_lua.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "db_mysql.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("auth_db", "db_url", "mysql://kamailio:kamailio@mysql/kamailio")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "load_credentials", "")

modparam("usrloc", "db_url", "mysql://kamailio:kamailio@mysql/kamailio")
modparam("usrloc", "db_mode", 2)

modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_contacts", 5)

modparam("app_lua", "load", "/etc/kamailio/lua/kamailio.lua")
cfgengine "lua"
